name: playground
description: SDUI Playground - visual builder demo for generic SDUI engine.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  sdui_engine:
    path: ../../packages/sdui_engine
  sdui_builder:
    path: ../../packages/sdui_builder
  graphql_flutter: ^5.3.0
  file_picker: ^10.3.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
